research_protocol:
  version: "group_refit_v2"
  test_status: "exploratory_reanalysis_previously_inspected_corpus"
  seeds: [42, 43, 44]
  cv_evaluation_target: "raw_models_refitted_on_all_outer_training_at_threshold_0.5"
  epoch_selection_split: "inner_training_groups"
  dataset_type: "synthetic"
  random_state: 42
  split_method: "two_stage_stratified_group_kfold"
  split_group: "Template_Group"
  split_ratios: [0.70, 0.15, 0.15]
  model_input_fields: ["Type", "Title", "Content"]
  excluded_generator_annotations:
    ["Sender_brand", "Suspicion_level", "LLM_likeness", "Phishing_technique", "Model_Source"]
  augmentation_enabled: false
  threshold_selection_split: "validation"
  ensemble_selection_split: "validation"
  ensemble_weighting: "equal"
  final_test_threshold_override_allowed: false
  inference_max_length: 256
  effective_training_batch_size: 16
  calibration:
    method: "sigmoid_logit"
    folds: 5
    split: "validation"
    selection_predictions: "group_disjoint_out_of_fold"
    ece_bins: 10
  deployment_scenarios:
    - {name: "prevalence_0.1pct_equal_cost", prevalence: 0.001, fp_cost: 1.0, fn_cost: 1.0}
    - {name: "prevalence_1pct_equal_cost", prevalence: 0.01, fp_cost: 1.0, fn_cost: 1.0}
    - {name: "prevalence_1pct_fn_10x", prevalence: 0.01, fp_cost: 1.0, fn_cost: 10.0}
    - {name: "prevalence_5pct_fn_10x", prevalence: 0.05, fp_cost: 1.0, fn_cost: 10.0}
  cross_validation:
    primary_protocol: "template_group"
    folds: 5
    secondary_protocol: "source_holdout"
    test_split_included: false
    inner_validation_folds: 5
    inner_selection_metric: "f1"
    early_stopping_patience: 3
    retain_fold_models: false
    bootstrap_resamples: 2000
    confidence_level: 0.95
  final_test_uncertainty:
    unit: "Template_Group"
    method: "cluster_bootstrap_percentile"
    resamples: 5000
    confidence_level: 0.95
  model_scope_amendment:
    date: "2026-07-16"
    excluded_model: "xlm-roberta-base"
    reason: "Removed from the final study scope because of disproportionate Apple MPS resource requirements and unstable reproducibility; no remaining model or threshold was changed in response to test performance."

baseline:
  tfidf:
    ngram_range: [1, 3]
    max_features: 50000
    min_df: 10

  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"

experiments:
  - name: "herbert-base"
    model_name: "allegro/herbert-base-cased"
    revision: "50e33e0567be0c0b313832314c586e3df0dc2297"
    max_length: 256
    batch_size: 8
    eval_batch_size: 16
    gradient_accumulation_steps: 2
    gradient_checkpointing: false
    epochs: 10
    learning_rate: 2.0e-5
    freeze_layers: 0

  - name: "polish-roberta-v2"
    model_name: "sdadas/polish-roberta-base-v2"
    revision: "918913247c71d34639eb43435afef058aa0471e9"
    max_length: 256
    batch_size: 8
    eval_batch_size: 16
    gradient_accumulation_steps: 2
    gradient_checkpointing: false
    epochs: 10
    learning_rate: 2.0e-5
    freeze_layers: 0

  - name: "distilbert-multilingual"
    model_name: "distilbert-base-multilingual-cased"
    revision: "45c032ab32cc946ad88a166f7cb282f58c753c2e"
    max_length: 256
    batch_size: 8
    eval_batch_size: 16
    gradient_accumulation_steps: 2
    gradient_checkpointing: false
    epochs: 10
    learning_rate: 2.0e-5
    freeze_layers: 0

hardware:
  profile: "macbook_pro_m4_max_48gb"
  precision: "float32"
  mps_memory_fraction: 0.8
  concurrent_models: 1
  dataloader_workers: 0
  cpu_threads: 8
  inference_batch_size: 16
  inference_oom_halving: true
  attention_implementation: "eager"
